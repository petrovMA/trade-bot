server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Grid analysis page (served by Spring Boot backend, not React SPA)
    location = /trade-bot/grid-analysis {
        proxy_pass http://trade-bot:8080/grid-analysis;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grid suitability checker page (served by Spring Boot backend, not React SPA)
    location = /trade-bot/grid-suitability {
        proxy_pass http://trade-bot:8080/grid-suitability;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API reverse proxy (handles /trade-bot/api/* from React frontend and grid-analysis)
    # Longer ^~ prefix takes priority over /trade-bot/ for API calls
    # Strips /trade-bot/api/ prefix: /trade-bot/api/positions → /positions on backend
    location ^~ /trade-bot/api/ {
        proxy_pass http://trade-bot:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings for long-running requests (emulation)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Redirect root to app base path
    location = / {
        return 301 /trade-bot/;
    }

    # Static assets — serve directly from disk, no SPA fallback.
    # Separate location avoids nested-regex-location inheritance bugs
    # (nested regex locations don't inherit try_files from parent).
    # Longer prefix "/trade-bot/assets/" wins over "/trade-bot/" automatically.
    location /trade-bot/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React app (base path /trade-bot/) — SPA fallback
    # Note: /trade-bot/api/ above has a longer prefix, so API calls are proxied, not served as static files
    # Files must be at /usr/share/nginx/html/trade-bot/ (see Dockerfile)
    location /trade-bot/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /trade-bot/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
    }

    # Error pages
    error_page 404 /trade-bot/index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
