# Docker Compose for SSL/HTTPS deployment
#
# SSL Certificate Configuration:
# Certificates are shared with AI-SIGNAL project (same domain: tradebotalphahorizon.duckdns.org)
# Default path: ~/AI-SIGNAL/alpha_horizon_py_trading/certbot/conf
#
# Usage on server:
#   docker compose -f docker-compose-ssl.yml up -d
#
# Custom cert path (if needed):
#   export LETSENCRYPT_PATH=/path/to/certbot/conf
#   docker compose -f docker-compose-ssl.yml up -d
#
services:
  trade-bot:
    build: .
    container_name: trade-bot-backend
    ports:
      - "8081:8080"
    volumes:
      - ./database:/app/database
      - ./exchangeBots:/app/exchangeBots
      - ./exchangeConfigs:/app/exchangeConfigs
      - ./logging:/app/logging
      - ./results:/app/results
      - ./collect_binance_candlestick.conf:/app/collect_binance_candlestick.conf
      - ./collect_bitmax_candlestick.conf:/app/collect_bitmax_candlestick.conf
      - ./collect_ftx_candlestick.conf:/app/collect_ftx_candlestick.conf
      - ./collect_gate_candlestick.conf:/app/collect_gate_candlestick.conf
      - ./collect_huobi_candlestick.conf:/app/collect_huobi_candlestick.conf
      - ./common.conf:/app/common.conf
      - ./flow_settings.json:/app/flow_settings.json
      - ./logback.xml:/app/logback.xml
    networks:
      - trade-bot-network
    healthcheck:
      # NOTE: backend image (amazoncorretto) contains curl but not wget
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: nginx/Dockerfile.ssl
    container_name: trade-bot-frontend
    ports:
      - "8082:80"    # HTTP (redirects to HTTPS)
      - "8443:443"   # HTTPS
    volumes:
      # SSL certificates from AI-SIGNAL certbot (shared domain)
      # Default: ~/AI-SIGNAL/alpha_horizon_py_trading/certbot/conf
      # NOTE: Avoid ${HOME} here because docker compose environment expansion can differ depending on how compose is started (sudo/systemd/etc).
      # Use a stable absolute default path for this server. Override with LETSENCRYPT_PATH if needed.
      - ${LETSENCRYPT_PATH:-/home/asus/AI-SIGNAL/alpha_horizon_py_trading/certbot/conf}:/etc/letsencrypt:ro
    depends_on:
      - trade-bot
    networks:
      - trade-bot-network
    restart: unless-stopped

networks:
  trade-bot-network:
    driver: bridge