server.address=0.0.0.0
server.port=8080

# ======== ACTUATOR / HEALTH ========
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:h2:file:./database/orders-history
spring.datasource.username=
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

logging.config=logback.xml

# ======== SESSION CONFIGURATION ========
# Custom session cookie name to avoid conflicts with other applications (e.g., AI-SIGNAL)
server.servlet.session.cookie.name=trade-bot-session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=1h

# ======== AUTHENTICATION ========
# NOTE: Authentication is handled by Python project's nginx auth_request
# No Spring Security needed - see docs/GOOGLE_AUTH_SETUP.md